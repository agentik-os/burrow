name: macOS app

# Unsigned / ad-hoc Burrow.app. No Apple signing secrets. Uploads the zip
# as burrow-macos-app and bundles the pinned burrow-engine.

on:
  push:
    branches:
      - 'cursor/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 70
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select newest Xcode
        run: |
          shopt -s nullglob
          XCODE_APPS=(/Applications/Xcode_*.app)
          [ "${#XCODE_APPS[@]}" -gt 0 ] \
            || { echo "::error::No versioned Xcode app found on the runner."; exit 1; }
          XCODE="$(printf '%s\n' "${XCODE_APPS[@]}" | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install checksum-pinned XcodeGen
        run: |
          bash ../scripts/fetch-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Fetch vendored Sentry framework
        run: bash ../scripts/fetch-sentry.sh

      - name: Fetch vendored Sparkle framework
        run: bash ../scripts/fetch-sparkle.sh

      - name: Generate project
        run: xcodegen generate

      - name: Fetch bundled burrow-engine
        working-directory: ${{ github.workspace }}
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          SHA="$(git ls-tree HEAD macos/vendor/burrow-engine | awk '$1 == "160000" && $2 == "commit" {print $3}')"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no gitlink for macos/vendor/burrow-engine"
            exit 1
          fi
          DEST="$RUNNER_TEMP/burrow-engine"
          git clone --quiet https://github.com/caezium/burrow-engine.git "$DEST"
          git -C "$DEST" -c advice.detachedHead=false checkout --quiet "$SHA"
          echo "BURROW_ENGINE_SRC=$DEST" >> "$GITHUB_ENV"
          echo "engine @ ${SHA:0:7}"

      - name: Install Rust
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then
            # shellcheck disable=SC1091
            source "$HOME/.cargo/env"
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cargo --version
          rustup show

      - name: Build unsigned Burrow.app
        run: |
          xcodebuild -project Burrow.xcodeproj -scheme Burrow \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$RUNNER_TEMP/dd/Build/Products/Release/Burrow.app"
          test -d "$APP"
          test -x "$APP/Contents/Resources/burrow" \
            || { echo "::error::Resources/burrow missing — burrow-engine did not bundle"; exit 1; }
          lipo -archs "$APP/Contents/Resources/burrow"
          bash ../scripts/sign-macos-app.sh "$APP" - adhoc Resources/Burrow.entitlements
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/burrow-macos-app.zip"

      - name: Upload Burrow.app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burrow-macos-app
          path: ${{ runner.temp }}/burrow-macos-app.zip
          if-no-files-found: error

      - name: Snapshot the navigation rail
        continue-on-error: true
        run: |
          touch Tests/.write-ui-snapshots
          xcodebuild test -project Burrow.xcodeproj -scheme Burrow \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:BurrowTests/LiquidGlassSnapshotTests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burrow-macos-ui-snapshots
          path: macos/Tests/ui-snapshots
          if-no-files-found: ignore
