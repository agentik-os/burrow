name: macOS app

# Unsigned / ad-hoc build of Burrow.app for forks that have no Apple
# signing secrets. Uploads the zipped app as the burrow-macos-app artifact.
# Does not notarize, staple, or publish a release.

on:
  push:
    branches:
      - 'cursor/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select newest Xcode
        run: |
          shopt -s nullglob
          XCODE_APPS=(/Applications/Xcode_*.app)
          [ "${#XCODE_APPS[@]}" -gt 0 ] \
            || { echo "::error::No versioned Xcode app found on the runner."; exit 1; }
          XCODE="$(printf '%s\n' "${XCODE_APPS[@]}" | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install checksum-pinned XcodeGen
        run: |
          bash ../scripts/fetch-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Fetch vendored Sentry framework
        run: bash ../scripts/fetch-sentry.sh

      - name: Fetch vendored Sparkle framework
        run: bash ../scripts/fetch-sparkle.sh

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned Burrow.app
        run: |
          xcodebuild -project Burrow.xcodeproj -scheme Burrow \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$RUNNER_TEMP/dd/Build/Products/Release/Burrow.app"
          test -d "$APP"
          # Ad-hoc identity. No Developer ID secret is available on this fork.
          bash ../scripts/sign-macos-app.sh "$APP" - adhoc Resources/Burrow.entitlements
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/burrow-macos-app.zip"
          codesign -dv "$APP" 2>&1 | head -20

      - name: Upload Burrow.app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burrow-macos-app
          path: ${{ runner.temp }}/burrow-macos-app.zip
          if-no-files-found: error

      - name: Snapshot the redesigned UI
        continue-on-error: true
        run: |
          # xcodebuild does not forward shell environment into XCTest.
          # A sentinel beside the test source is visible via #filePath.
          touch Tests/.write-ui-snapshots
          xcodebuild test -project Burrow.xcodeproj -scheme Burrow \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:BurrowTests/DesignSnapshotTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burrow-macos-ui-snapshots
          path: macos/Tests/ui-snapshots
          if-no-files-found: ignore
